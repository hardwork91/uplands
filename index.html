  /* Layout: lienzo a pantalla completa con cielo; HUD arriba (nivel + contador), controles abajo */
  :root {
    color-scheme: light;
    --sky-top: #7fb8e6;
    --sky-bot: #e4f1f6;
    --ink: #1f3346;
    --muted: #4f6b82;
    --panel: rgba(255, 255, 255, 0.72);
    --line: rgba(31, 51, 70, 0.14);
    --gem: #18a7c9;
    --fuel: #2f8fe0;
    --star: #e8364a;
    --star-off: rgba(31, 51, 70, 0.22);
    --win: #2f8f4e;
    --warn: #c0492b;
    /* Fuente del juego: Anak Bijak (incrustada abajo); Inter de respaldo para símbolos que no tiene, como ★ */
    --font-display: "Anak Bijak", "Inter", system-ui, sans-serif;
    --font-body: "Anak Bijak", "Inter", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 80%);
    color: var(--ink); font-family: var(--font-body);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top {
    position: fixed; top: 0; left: 0; right: 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    pointer-events: none;
  }
  .panel {
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; max-width: 360px; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.06em; }
  #lvl { font-family: var(--font-display); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  #hint { margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink); text-wrap: pretty; }
  .counter { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 92px; }
  .counter small { font-family: var(--font-display); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
  #count { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--gem); font-variant-numeric: tabular-nums; }
  #count.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    pointer-events: none;
  }
  .left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; pointer-events: auto; }
  button {
    font-family: var(--font-display); font-size: 13px; color: var(--ink);
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .right { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
  .tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .tool {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: 76px; min-height: 84px; padding: 10px 6px; border-radius: 10px;
  }
  .tool .ico { font-family: var(--font-body); font-size: 28px; line-height: 1; }
  .tool .lbl { font-size: 11px; letter-spacing: 0.03em; }
  .tool .cost { display: flex; align-items: center; gap: 4px; font-size: 10px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .tool .coin { width: 10px; height: 10px; }
  @media (max-width: 520px) {
    .top { flex-direction: column; align-items: stretch; gap: 8px; }
    .right { flex-wrap: nowrap; justify-content: space-between; gap: 6px; }
    .tools { flex-wrap: nowrap; gap: 6px; }
    .tool { width: 58px; min-height: 64px; padding: 6px 2px; gap: 2px; }
    .tool .ico { font-size: 20px; }
    .tool .lbl { font-size: 9px; letter-spacing: 0; }
    .counter { min-width: 0; padding: 6px 10px; }
    #count { font-size: 24px; }
    #stars { font-size: 13px; }
    .coins { font-size: 12px; margin-top: 3px; }
  }
  #hintBtn { color: #8a6a00; }
  #undoBtn { color: #8a2f5a; }
  #slowBtn { color: #2f5f9a; }
  #soundBtn { color: #3c6b4f; }
  #soundBtn.muted { color: var(--muted); opacity: 0.75; }
  #slowBtn.active { background: #2f5f9a; color: #fff; border-color: #2f5f9a; }
  #modalBody { display: flex; flex-direction: column; gap: 10px; }
  #banner .undo { pointer-events: auto; display: block; margin: 8px auto 0; font-size: 14px; color: #8a2f5a; }
  /* Cámara lenta: viñeta azulada en los bordes */
  #slowFx { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px 20px rgba(70, 130, 255, 0.45); transition: opacity 0.4s; opacity: 0; }
  body.slow #slowFx { opacity: 1; }
  .coins { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #e0a800 70%); box-shadow: inset 0 0 0 2px #b88400; flex: none; }
  #coins.pop { animation: pop 0.3s ease-out; }
  #toast {
    z-index: 30;
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(118px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff;
    font-size: 14px; box-shadow: 0 6px 24px rgba(31, 51, 70, 0.3);
    pointer-events: none; max-width: calc(100% - 32px); animation: toastIn 0.35s ease-out;
  }
  #toast b { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.03em; }
  #toast small { display: block; opacity: 0.75; font-size: 12px; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(31, 51, 70, 0.35); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }
  #modal .card { background: #fff; color: var(--ink); border-radius: 12px; padding: 22px 22px 18px; max-width: 360px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 40px rgba(31, 51, 70, 0.3); }
  #modal h2 { margin: 0; font-family: var(--font-display); font-size: 20px; color: #8a6a00; }
  #modal p { margin: 0; font-size: 14px; line-height: 1.5; }
  #modal .cost { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 13px; line-height: 1.4; }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  #modal .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  #stars { display: flex; gap: 3px; font-size: 18px; line-height: 1; margin-top: 4px; }
  #stars span { color: var(--star-off); }
  #stars .got { color: var(--star); }
  #stars .lost { color: var(--star-off); opacity: 0.5; }
  .wstars { display: block; font-size: 38px; letter-spacing: 6px; margin-top: 4px; }
  .wstars .got { color: var(--star); } .wstars .off { color: var(--star-off); }
  .dots button .best { display: block; font-size: 8px; letter-spacing: 0; color: var(--star); min-height: 9px; font-family: var(--font-body); }
  .dots button.on .best { color: #ffb3bb; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots button { width: 34px; height: 38px; padding: 0; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .dots button.on { background: var(--ink); color: #fff; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); pointer-events: auto; }
  .dpad button { width: 48px; height: 48px; padding: 0; font-size: 20px; font-family: var(--font-body); }
  .dpad .nw { grid-area: 1 / 1; } .dpad .ne { grid-area: 1 / 3; }
  .dpad .sw { grid-area: 3 / 1; } .dpad .se { grid-area: 3 / 3; }

  #banner {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 6vw, 40px);
    padding: 14px 22px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-align: center; pointer-events: none; max-width: calc(100% - 32px);
  }
  #banner.win { color: var(--win); animation: rise 0.5s ease-out; }
  #banner.stuck { color: var(--warn); font-size: clamp(16px, 4.5vw, 24px); top: auto; bottom: 30%; }
  /* Con el cartel de reintentar, el juego queda bloqueado: solo responden Reintentar y Reiniciar */
  body.locked #scene { pointer-events: none; }
  body.locked .dpad, body.locked #hintBtn, body.locked #slowBtn, body.timeout #undoBtn { opacity: 0.4; pointer-events: none; }
  #banner .retry {
    pointer-events: auto; display: block; margin: 12px auto 0;
    font-size: 15px; padding: 12px 20px;
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  #banner .retry:hover { background: #2c4a66; color: #fff; }
  #banner small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 6px; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @media (max-width: 520px) { .brand { max-width: none; } #hint { font-size: 12px; } }
  @media (prefers-reduced-motion: reduce) { #count.pop, #banner.win { animation: none; } }

  /* ---------- Pantallas: splash, inicio, mapa de mundos, pausa, resultado, ajustes ---------- */
  body:not([data-screen="game"]) .top, body:not([data-screen="game"]) #slowFx,
  body:not([data-screen="game"]) #banner, body:not([data-screen="game"]) #levelTag { display: none !important; }
  .top { justify-content: flex-end; }
  .screen { position: fixed; inset: 0; z-index: 10; }
  .logo { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; color: var(--ink); text-shadow: 0 3px 0 rgba(255,255,255,0.6); }
  #splash { display: grid; place-items: center; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 80%); transition: opacity 0.6s; cursor: pointer; }
  #splash .logo { font-size: clamp(44px, 12vw, 96px); animation: logoIn 1s ease-out both; }
  #splash.out { opacity: 0; }
  @keyframes logoIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: none; } }

  #home { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #home .logo { font-size: clamp(42px, 11vw, 84px); }
  .stats { display: flex; gap: 10px; }
  .stat { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--line); font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .stat .sicon { color: var(--star); font-size: 17px; line-height: 1; }
  .big { font-size: 22px; padding: 18px 48px; border-radius: 14px; letter-spacing: 0.06em; }
  .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .primary:hover { background: #2c4a66; color: #fff; }
  .home-row { display: flex; gap: 10px; }

  /* Mapa de saltos: el lienzo 3D se ve detrás; aquí solo van las chapas de los niveles y los carteles */
  #map { background: transparent; touch-action: none; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; }
  #mapPins { position: absolute; inset: 0; pointer-events: none; }
  /* velo de nubes sobre los niveles que aún no se ven: opaco arriba y con borde algodonoso abajo */
  .pin { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 0; border: none; background: transparent; box-shadow: none; border-radius: 18px; will-change: transform;
    backdrop-filter: none; -webkit-backdrop-filter: none; }   /* sin el desenfoque de los botones normales: se ve la isla */
  .pin:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .map-top { position: absolute; z-index: 2; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none; }
  .map-top > * { pointer-events: auto; }

  .overlay { display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 15; }
  #pause { background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 85%); }   /* opaco: tapa el tablero */
  .menu { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: min(300px, 100%); }
  .menu h2 { margin: 0 0 10px; text-align: center; font-family: var(--font-display); font-size: 30px; letter-spacing: 0.08em; color: var(--ink); }
  .menu button { font-size: 16px; padding: 14px; }
  #result, #settings { background: rgba(31, 51, 70, 0.35); }

  // Estrella: gema roja más grande con un anillo de tiempo sobre la casilla

  // ---------- Portal: remolino animado ----------
  // Textura de brazos en espiral (blanca; el material la tiñe del color del portal)
  const SWIRL_TEX = (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const x = cv.getContext('2d'); const C = 128;
    const glow = x.createRadialGradient(C, C, 0, C, C, C);
    glow.addColorStop(0, 'rgba(255,255,255,0.95)'); glow.addColorStop(0.35, 'rgba(255,255,255,0.35)'); glow.addColorStop(1, 'rgba(255,255,255,0)');

  const G_SPARK = new THREE.BoxGeometry(0.04, 0.04, 0.04);

    // Borde, fondo oscuro y dos capas de remolino girando en sentidos opuestos

    rim.rotation.x = Math.PI / 2; rim.position.y = 0.05; fx.add(rim);

    const s1 = flat(new THREE.CircleGeometry(0.29, 32), new THREE.MeshBasicMaterial({ map: SWIRL_TEX, color: col, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), 0.02);
    const s2 = flat(new THREE.CircleGeometry(0.2, 32), new THREE.MeshBasicMaterial({ map: SWIRL_TEX, color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending }), 0.026);

    const sparks = [];
    for (let i = 0; i < 10; i++) {

  // Tonos de hierba: cada bloque toma uno al azar cada vez que se carga o reinicia el nivel
  // Todas las casillas de hierba usan el mismo verde de su mundo (los tonos al azar están desactivados)
  const randomGreen = () => theme.greens[0];

  // Bidón de combustible rojo: cuerpo con la "X" en relieve, asa triple, tapón y costuras
  const JG = {
    body: new THREE.BoxGeometry(0.2, 0.25, 0.12),

    const m = new THREE.Mesh(JG.body, canMat.clone());   // la raíz pulsa (emissive)

  // ---------- Indicador de pasos que le quedan a una casilla (sin números) ----------
  // Capas + color: por cada paso de más hay una losa apilada encima, y la casilla es más oscura.
  // Al entrar se gasta un paso: la losa de arriba se desprende y la casilla se aclara un nivel.
  const passShade = n => Math.pow(0.8, Math.max(0, (n ?? 1) - 1));

    if (!showsPasses(c)) return;
    const passes = c.passes ?? 1, extra = Math.max(0, passes - 1);

  // Detalle de cada casilla, siempre igual para la misma casilla
  function decorateTile(g, cell, top) {
    const rnd = rngFor(cell.key + ':' + (cell.base || cell.kind));
    const r = (a, b) => a + rnd() * (b - a);
    const d = new Deco();
    const ice = cell.kind === 'ice', lock = cell.base === 'lock', path = cell.kind === 'oneway';
    const grassy = !ice && !lock && !path;
    const topCol = lock ? 0x9a9da0 : top;

      const [x, z] = [[t, -0.49], [0.49, t], [t, 0.49], [-0.49, t]][side];
      if (ice) d.add(DG.cone4, 0xbfe8f7, x, -0.17 - h / 2, z, Math.PI, 0, 0, 0.025, h, 0.025);   // carámbanos

    for (let i = 0; i < 7; i++) {
      const side = Math.floor(rnd() * 4), t = r(-0.38, 0.38), y = r(-0.5, -0.2), sz = r(0.04, 0.08);

    for (let i = 0; i < 3; i++) {

      }

        for (let k = 0; k < 4; k++) d.add(DG.box, petal, x + Math.cos(k * Math.PI / 2) * 0.02, 0.065, z + Math.sin(k * Math.PI / 2) * 0.02, 0, 0, 0, 0.022, 0.012, 0.022);

      for (let i = 0; i < 4; i++) d.add(DG.oct, 0xeefaff, [-0.38, 0.38][i % 2] + r(-0.04, 0.04), 0.03, [-0.38, 0.38][(i >> 1) % 2] + r(-0.04, 0.04), 0, r(0, 3), 0, 0.03, r(0.05, 0.09), 0.03);

      for (const x of [-0.38, 0.38]) for (const z of [-0.38, 0.38]) d.add(DG.cyl, 0x6f7377, x, 0.006, z, 0, 0, 0, 0.022, 0.012, 0.022);

    d.build(g, ice ? (c => new THREE.MeshStandardMaterial({ color: c, emissive: shade(c, 0.25), roughness: 0.35, metalness: 0.1 })) : lam);
  }

  function makeTile(cell) {
    const g = new THREE.Group();
    const top = cell.kind === 'oneway' ? 0xd8c79a : cell.kind === 'ice' ? 0xbfe8f7 : cell.base === 'lock' ? 0xffffff : shade(cell.green || randomGreen(), passShade(cell.passes));
    const ice = cell.kind === 'ice';
    // El hielo es un bloque azul entero (superficie brillante, cuerpo y raíz azulados)
    const iceMat = (c, e) => new THREE.MeshStandardMaterial({ color: c, emissive: e, emissiveIntensity: 0.2, roughness: 0.35, metalness: 0.1 });
    const parts = [
      [G.grass, ice ? iceMat(0x8fcfec, 0x2a6f99) : cell.base === 'lock' ? concreteMat : lam(top), -0.07],
      [G.dirtSide, ice ? iceMat(0x4fb0e6, 0x1a6fa8) : lam(0x8a5a3b), -0.34],
      [G.rock, ice ? iceMat(0x3d8cc4, 0x123f66) : lam(0x6e5b4e), -0.9],
    ];
    for (const [geo, mat, y] of parts) {
      const m = new THREE.Mesh(geo, mat);
      m.position.y = y; m.castShadow = true; m.receiveShadow = true;
      if (geo === G.rock) { m.rotation.x = Math.PI; m.rotation.y = Math.PI / 4; }
      m.userData.key = cell.key;
      if (geo === G.grass) cell.top = m;
      g.add(m);
    }
    decorateTile(g, cell, top);
    cell.decoPasses = cell.passes ?? 1;
    cell.group = g;
    buildPassFx(cell);
    if (cell.kind === 'oneway') {
      const holder = new THREE.Group();
      const a = new THREE.Mesh(G.arrow, new THREE.MeshBasicMaterial({ color: 0x8a6b3a, transparent: true }));
      a.rotation.x = -Math.PI / 2; a.position.set(0, 0.006, 0.3); a.scale.setScalar(0.5);
      holder.add(a); holder.rotation.y = YAW[cell.dir];
      g.add(holder);
      cell.arrow = holder;
      // Barandas en las caras por las que no se puede entrar
      const rails = new THREE.Group();
      for (const side of Object.keys(DIRS)) if (side !== OPP[cell.dir]) {
        const r = makeRail(); r.rotation.y = YAW[side]; rails.add(r);
      }
      g.add(rails); cell.rails = rails;
    }
    if (cell.kind === 'lock') {
      // Barrera industrial: vallas con franjas del color de su interruptor y negras por los 4 lados,
      // con una luz del color de su interruptor en cada poste
      const col = KEY_COLORS[cell.color] || 0xffffff;

      const outer = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.55, 12), new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
      const inner = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.32, 10), new THREE.MeshBasicMaterial({ color: 0xfff3a0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      outer.rotation.x = inner.rotation.x = Math.PI;   // apuntan hacia abajo

  }
  let player = makePlayer();
  scene.add(player);
  const setFlames = on => { player.userData.flames.visible = on; };
  // Nube de humo en la base (aterrizaje y despegue)
  const puffGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  function spawnPuff(at) {
    for (let i = 0; i < 12; i++) {
      const m = new THREE.Mesh(puffGeo, new THREE.MeshLambertMaterial({ color: 0xf2f2f2, transparent: true, opacity: 0.9 }));
      const a = (i / 12) * Math.PI * 2 + Math.random() * 0.4, sp = 0.5 + Math.random() * 0.4;
      m.position.copy(at); m.position.y += 0.05; world.add(m);
      tween(0.9, k => {
        m.position.x = at.x + Math.cos(a) * sp * k; m.position.z = at.z + Math.sin(a) * sp * k;
        m.position.y = at.y + 0.05 + 0.25 * k;
        m.scale.setScalar(1 + k * 1.6); m.material.opacity = 0.9 * (1 - k);
      }, () => world.remove(m));
    }
  }
  function freshPlayer() {
    if (player.parent) player.parent.remove(player);
    player = makePlayer(); scene.add(player);
  }

  // ---------- Estado del juego ----------
  let L = 0, cells = {}, pos = null, remaining = 0, W = 0, H = 0;
  let timersOn = false, timeMax = 40, timeLeft = 40, starsShown = 3;
  let rippleT = -1, rippleO = [0, 0];
  const tmpV = new THREE.Vector3();
  let phase = 'idle'; // idle | moving | won | intro
  let queued = null;
  const tweens = [], falling = [];
  const key = (x, z) => x + ',' + z;
  const toWorld = (x, z) => new THREE.Vector3(x - (W - 1) / 2, 0, z - (H - 1) / 2);

  const $ = id => document.getElementById(id);
  const banner = $('banner');
  function showBanner(html, cls) {
    banner.innerHTML = html; banner.className = cls; banner.hidden = false;
    document.body.classList.toggle('locked', cls === 'stuck');
  }
  function hideBanner() { banner.hidden = true; document.body.classList.remove('locked', 'timeout'); }
  // Botón clicable dentro del cartel (el cartel en sí no captura clics)
  const retryBtn = () => `<button class="retry" type="button">${tr('tryAgain')}</button>`;
  banner.addEventListener('click', e => {
    if (e.target.closest('.retry')) restart();
    if (e.target.closest('.undo')) undo();
    if (e.target.closest('.tolevels')) backFromLevel();
  });
  let fuelTotal = 0;
  function setCount(n, pop) {
    const got = fuelTotal - n;
    $('tankFill').style.height = (fuelTotal ? got / fuelTotal * 100 : 0) + '%';
    $('tankCount').textContent = `${got}/${fuelTotal}`;   // recogidos / total
    const t = $('tank');
    if (pop) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
    t.classList.toggle('full', fuelTotal > 0 && n === 0);
  }

  function tween(dur, update, done) { tweens.push({ t: 0, dur, update, done }); }
  const ease = k => 1 - Math.pow(1 - k, 3);

  function dropObject(obj) {
    obj.traverse(o => {
      if (o.material) { o.material = o.material.clone(); o.material.transparent = true; }
    });
    falling.push({ obj, vy: 0, t: 0, spin: (Math.random() - 0.5) * 2 });
  }

  function loadLevel(i, withIntro = true) {
    L = i;
    hideCountdown();
    tweens.length = 0;
    if (player.parent !== scene) freshPlayer();
    player.scale.set(1, 1, 1);
    world.children.forEach(disposeMerged);
    while (world.children.length) world.remove(world.children[0]);
    rippleT = -1;
    cells = {}; hideBanner(); queued = null;
    history = []; endSlow(); pendingSlow = false;
    const def = LEVELS[i];
    const grid = def.rows.map(r => r.trim().split(/\s+/));
    H = grid.length; W = Math.max(...grid.map(r => r.length));
    remaining = 0;
    grid.forEach((row, z) => row.forEach((t, x) => {
      if (t === '.') return;
      // passes = veces que se puede entrar antes de que caiga; coins = bidón (0 o 1)
      const c = { key: key(x, z), x, z, kind: 'normal', coins: 0, passes: 1 };
      if (t === 'S') { pos = [x, z]; c.passes = 0; }
      else if (/^\d$/.test(t)) { c.passes = +t; c.coins = +t > 0 ? 1 : 0; }
      else if (ARROW[t]) { c.kind = 'oneway'; c.dir = ARROW[t]; }
      else if (/^[a-z]$/.test(t)) { c.kind = 'portal'; c.color = t; }
      else if (t === '+' || t === '+2') { c.kind = 'ice'; c.passes = t === '+2' ? 2 : 1; }   // hielo: 1 o 2 pasos
      else if (/^K\d$/.test(t)) { c.kind = 'key'; c.color = t[1]; }
      else if (/^L\d$/.test(t)) { c.kind = 'lock'; c.color = t[1]; c.passes = 1; c.coins = 1; }   // barreras: siempre 1 paso
      c.base = c.kind; c.green = randomGreen();
      remaining += c.coins;
      cells[c.key] = c;
    }));
    fuelTotal = remaining;
    for (const c of Object.values(cells)) if (c.kind === 'portal')
      c.pair = Object.values(cells).find(o => o !== c && o.kind === 'portal' && o.color === c.color).key;

    // Barra de tiempo: llena al empezar; empieza a bajar con el primer movimiento
    timersOn = false; timeMax = def.time || 40; timeLeft = timeMax; starsShown = 3;
    renderBar();

    // El mapa aparece subiendo desde abajo, casilla por casilla
    let idx = 0, maxIntro = 0;
    for (const c of Object.values(cells)) {
      // c.outer = hueco de la cuadrícula (sube al aparecer); c.group = el bloque que flota
      // y es el padre de todo lo que tiene encima (gemas, vallas, portal, jugador)
      c.group = makeTile(c);
      c.outer = new THREE.Group();
      c.outer.add(c.group);
      const home = toWorld(c.x, c.z);
      c.outer.position.copy(home); c.outer.position.y = 5;
      world.add(c.outer);
      c.bobAmp = 0.011 + Math.random() * 0.009;
      c.bobSpeed = 0.9 + Math.random() * 0.8;
      c.bobPhase = Math.random() * Math.PI * 2;
      // Orden aleatorio: todos caen casi a la vez, cada uno con un pequeño retraso al azar
      const delay = withIntro ? Math.random() * 0.6 : Math.random() * 0.15;
      const dur = withIntro ? 1.1 : 0.6;
      maxIntro = Math.max(maxIntro, delay + dur);
      const g = c.outer;
      // Los bloques bajan suavemente desde arriba, uno tras otro, apareciendo (fade in) mientras caen
      const faders = [];
      g.traverse(o => {
        if (!o.material) return;
        o.material = o.material.clone();
        o.userData.baseOpacity = o.material.opacity;
        o.userData.wasTransparent = o.material.transparent;
        o.material.transparent = true; o.material.opacity = 0;
        faders.push(o);
      });
      tween(dur + delay, k => {
        const kk = Math.min(1, Math.max(0, (k * (dur + delay) - delay) / dur));
        g.position.y = 5 * Math.pow(1 - kk, 3);
        const a = Math.min(1, kk * 1.5);
        for (const o of faders) o.material.opacity = o.userData.baseOpacity * a;
      }, () => {
        g.position.y = 0;
        for (const o of faders) {
          o.material.opacity = o.userData.baseOpacity;
          o.material.transparent = o.userData.wasTransparent;
          o.material.needsUpdate = true;
        }
      });
      idx++;
    }
    showLevelTag(i);
    setCount(remaining);
    document.querySelectorAll('#dots button').forEach((b, j) => b.classList.toggle('on', j === i));
    fitCamera();

    // El jugador cae del cielo sobre la casilla de inicio
    phase = 'intro';
    player.visible = false;
    const start = toWorld(pos[0], pos[1]);
    player.rotation.y = YAW.E;   // aparece mirando hacia abajo a la derecha (hacia la cámara)
    const wait = maxIntro + 0.05;
    // La cuenta atrás va con el aterrizaje: «Preparados» al aparecer, «Listos» a mitad de bajada y «¡Ya!» al posarse
    const land = () => {
      phase = 'intro';
      player.visible = true;
      player.scale.set(1, 1, 1);
      player.position.set(start.x, 9, start.z);
      // Aterrizaje propulsado: baja rápido, frena con las toberas, flota un instante y se posa
      setFlames(true); Snd.sfx.thrust(1.5);
      let said = 0; cdWord(0);
      tween(1.5, k => {
        player.position.y = k < 0.75 ? 0.35 + 8.65 * Math.pow(1 - k / 0.75, 3) : 0.35 * (1 - (k - 0.75) / 0.25);
        if (k >= 0.5 && said < 1) { said = 1; cdWord(1); }
      }, () => {
        setFlames(false);
        const sc = cells[key(pos[0], pos[1])];
        spawnPuff(toWorld(pos[0], pos[1]));
        sc.group.attach(player); player.position.set(0, 0, 0);
        rippleT = clock.elapsedTime; rippleO = pos.slice();
        Snd.sfx.land();
        squash();
        phase = 'idle';
        cdWord(2);   // ¡Ya!: empieza el tiempo
        timersOn = true; levelReadyT = clock.elapsedTime;
        maybeHand(); checkStuck();
      });
    };
    // primero se colocan los bloques; luego las explicaciones de mecánicas nuevas (si las hay) y el aterrizaje
    tween(wait, () => {}, () => { phase = 'idle'; if (!maybeMechanicIntro(land)) land(); });
  }

  function squash() {
    const b = player.userData.body;
    tween(0.25, k => {
      const s = Math.sin(k * Math.PI) * 0.25;
      b.scale.set(1 + s, 1 - s, 1 + s);
    }, () => b.scale.set(1, 1, 1));
  }

  // Desde (x,z) en dirección d: atraviesa el hielo que haya y devuelve dónde acabas.
  // null si el destino es un hueco o una flecha que no deja entrar por ahí.
  function resolveMove(get, x, z, d) {
    const [dx, dz] = DIRS[d];
    const ices = [];
    let cx = x + dx, cz = z + dz;
    for (;;) {
      const c = get(key(cx, cz));
      // Resbalar del hielo a un hueco sí se permite: el jugador cae y pierde
      if (!c) return ices.length ? { ices, dest: null, fall: [cx, cz] } : null;
      if (c.kind === 'oneway' && c.dir !== d) return null;
      if (c.kind === 'lock') return null;
      if (c.kind !== 'ice') return { ices, dest: key(cx, cz) };
      ices.push(key(cx, cz)); cx += dx; cz += dz;
    }
  }
  // Movimientos que no terminan en caída (para detectar "sin salida")
  function canMove(d) { const r = resolveMove(k => cells[k], pos[0], pos[1], d); return !!r && !r.fall; }

  let bumpStreak = 0, levelReadyT = 0;
  function bump(d) {
    Snd.sfx.bump();
    if (++bumpStreak >= 10) unlockAchievement('stubborn');
    const [dx, dz] = DIRS[d];
    const base = player.position.clone();
    player.rotation.y = YAW[d];
    phase = 'moving';
    tween(0.16, k => {
      const s = Math.sin(k * Math.PI) * 0.12;
      player.position.set(base.x + dx * s, 0, base.z + dz * s);
    }, () => { player.position.copy(base); phase = 'idle'; });
  }

  function move(d) {
    if (phase === 'moving') { queued = d; return; }
    if (phase !== 'idle') return;
    const res = resolveMove(k => cells[k], pos[0], pos[1], d);
    if (!res) { bump(d); return; }
    pushHistory();
    hideHand();
    bumpStreak = 0;
    if (!timersOn && levelReadyT && clock.elapsedTime - levelReadyT >= 60) unlockAchievement('patience');
    timersOn = true;
    if (res.ices.length) { prog.stats.ice = (prog.stats.ice || 0) + res.ices.length; saveProg(); if (prog.stats.ice >= 5) unlockAchievement('skater'); }
    hideBanner();
    clearHints();
    const cur = cells[key(pos[0], pos[1])];
    const target = res.fall ? null : cells[res.dest];
    const ices = res.ices.map(k => cells[k]);
    ices.forEach(c => { c.passes = Math.max(0, (c.passes ?? 1) - 1); if (c.passes <= 0) delete cells[c.key]; });

    // La casilla que dejas se cae si ya no tiene gemas
    if (cur.passes <= 0) { delete cells[cur.key]; dropObject(cur.group); Snd.sfx.fall(); }

    phase = 'moving';
    player.rotation.y = YAW[d];
    // Salto a la primera casilla; si es hielo, resbala recto hasta el destino
    const stops = [...ices, target || { fall: true, x: res.fall[0], z: res.fall[1] }];
    if (player.parent !== scene) scene.attach(player);
    const segment = (i, from) => {
      const c = stops[i];
      const live = () => (c.group ? c.group.getWorldPosition(tmpV) : tmpV.copy(toWorld(c.x, c.z)));
      const hop = i === 0;
      // Si el destino es un portal, ese mismo salto es la zambullida: sube en seno, cae dentro
      // del remolino encogiéndose (sin giro; el giro es solo de salida), y el portal se encoge hasta desaparecer
      const dive = c.kind === 'portal' && i === stops.length - 1;
      if (i === 0) { if (dive) Snd.sfx.portalIn(); else Snd.sfx.hop(); if (c.kind === 'ice') Snd.sfx.slide(0.2 + (stops.length - 1) * 0.12); }
      tween(dive ? 0.45 : hop ? 0.17 : 0.12, k => {
        player.position.lerpVectors(from, live(), dive ? Math.min(1, k * 1.6) : k);
        if (dive) {
          player.position.y += 0.42 * Math.sin(Math.PI * 1.35 * k);
          player.scale.setScalar(k < 0.5 ? 1 : 1 - ((k - 0.5) / 0.5) * 0.92);
          c.portalFx.scale.setScalar(k < 0.45 ? 1 : Math.max(0.001, 1 - (k - 0.45) / 0.55));
        } else if (hop) player.position.y += Math.sin(k * Math.PI) * (c.kind === 'ice' ? 0.18 : 0.32);
      }, () => {
        const to = live().clone();
        player.position.copy(to);
        if (i < stops.length - 1) {
          // dejas atrás el hielo: cae si no le quedan pasos; si le quedan, se desprende su capa de encima
          if (c.passes <= 0) dropObject(c.group);
          else if (c.passFx && c.passFx.children.length) { const top = c.passFx.children[c.passFx.children.length - 1]; world.attach(top); dropObject(top); buildPassFx(c); }
          segment(i + 1, to); return;
        }
        if (c.fall) return fallOff();
        pos = [target.x, target.z];
        if (target.kind === 'portal') enterPortal(target);
        else {
          target.group.attach(player); player.position.set(0, 0, 0);
          usePass(target);
          if (target.kind === 'oneway') openOneway(target);
          if (target.kind === 'key') useKey(target);
          collect(target); afterMove();
        }
      });
    };
    segment(0, player.position.clone());
  }

  function fallOff() {
    phase = 'lost'; queued = null;
    dropObject(player);
    Snd.sfx.voidFall();
    showBanner(tr('fell') + lostButtons(), 'stuck');
    vib(80);
    unlockAchievement('edge');
  }

  function collect(c) {
    if (c.coins <= 0) return;
    c.coins--; remaining--;
    setCount(remaining, true);
    const gem = c.gems.pop();
    Snd.sfx.gem(remaining);
    gem.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; } });
    const y0 = gem.position.y;
    tween(0.4, k => {
      gem.position.y = y0 + k * 0.8;
      gem.scale.setScalar(1 + k * 0.6);
      gem.traverse(o => { if (o.material) o.material.opacity = 1 - k; });
    }, () => c.group.remove(gem));
    squash();
  }

  // Pisar un interruptor: el botón se hunde y se iluminan; las barreras de su color se bajan
  function useKey(c) {
    Snd.sfx.button(); Snd.sfx.barrier();
    c.kind = 'normal';
    const cap = c.button;
    tween(0.15, k => { cap.position.y = 0.09 - 0.06 * k; cap.material.emissiveIntensity = 0.15 + 0.6 * k; });
    for (const l of Object.values(cells)) if (l.kind === 'lock' && l.color === c.color) openLock(l);
  }
  function openLock(l) {
    l.kind = 'normal';
    const rails = l.rails;
    tween(0.6, k => { rails.position.y = -0.4 * ease(k); }, () => l.group.remove(rails));
  }

  // Las barandas se hunden en la tierra, la flecha se desvanece y queda un bloque normal
  function openOneway(c) {
    Snd.sfx.gate();
    c.kind = 'normal';
    const rails = c.rails, arrow = c.arrow, top = c.top.material;
    const from = top.color.clone(), to = new THREE.Color(c.green || randomGreen());
    const am = arrow.children[0].material;
    tween(0.4, k => {
      const e = ease(k);
      rails.position.y = -0.34 * e;
      am.opacity = 1 - e;
      top.color.copy(from).lerp(to, e);
    }, () => { c.group.remove(rails); c.group.remove(arrow); });
  }

  function enterPortal(p) {
    const other = cells[p.pair];
    phase = 'moving';
    // La zambullida ya ocurrió en el salto hacia el portal; el portal de entrada desaparece
    p.group.remove(p.portalFx); p.portalFx = null;
    {
      delete cells[p.key]; dropObject(p.group);
      // Salida: sale disparado del otro portal, que se queda como casilla normal sin gemas
      other.kind = 'normal'; other.passes = 0;
      const fx = other.portalFx;
      tween(0.35, k => fx.scale.setScalar(1 - k), () => other.group.remove(fx));
      other.group.attach(player); player.position.set(0, -0.3, 0);
      prog.stats.portals = (prog.stats.portals || 0) + 1; saveProg();
      if (prog.stats.portals >= 10) unlockAchievement('traveler');
      Snd.sfx.portalOut();
      pos = [other.x, other.z];
      const rot1 = player.rotation.y;
      tween(0.62, k => {
        player.position.y = -0.3 * (1 - k) + 1.25 * Math.sin(Math.PI * k);   // arco alto que aterriza en el bloque
        player.scale.setScalar(Math.min(1, 0.08 + k * 3.7));
        player.rotation.y = rot1 + Math.min(1, k * 1.4) * Math.PI * 2;
      }, () => {
        player.position.set(0, 0, 0); player.scale.set(1, 1, 1); player.rotation.y = rot1;
        squash();
        afterMove();
      });
    }
  }

  function afterMove() {
    if (remaining === 0) return win();
    phase = 'idle';
    if (queued) { const q = queued; queued = null; move(q); return; }
    if (maybeHintTutorial()) return;
    if (maybeUndoTutorial()) return;
    checkStuck();
  }

  function checkStuck() {
    if (phase !== 'idle' || remaining === 0) return;
    if (!Object.keys(DIRS).some(canMove)) {
      phase = 'lost'; queued = null;
      Snd.sfx.lose();
      showBanner(`${tr('stuckT')}<small>${tr('stuckS')}</small>` + lostButtons(), 'stuck');
      vib([40, 60, 40]);
      unlockAchievement('stuck');
    }
  }

  // Pasar el nivel como si lo hubieras completado (recoge todo el combustible al momento)
  function skipLevel() {
    if (!['idle', 'countdown', 'lost'].includes(phase) || !$('modal').hidden || !$('pause').hidden) return;
    hideCountdown(); hideBanner(); clearHints(); hideHand(); queued = null;
    for (const c of Object.values(cells)) { for (const g of c.gems || []) g.visible = false; c.coins = 0; }
    remaining = 0; setCount(0, true);
    win();
  }
  $('skipBtn').addEventListener('click', skipLevel);
  function win() {
    phase = 'won'; queued = null;
    Snd.sfx.win();
    const ff = $('fuelFull'); ff.textContent = tr('fuelFull'); ff.hidden = false;
    ff.style.animation = 'none'; void ff.offsetWidth; ff.style.animation = '';
    clearTimeout(ff._h); ff._h = setTimeout(() => { ff.hidden = true; }, 1900);
    const got = starsNow();
    if (L === CUSTOM) { tween(1.1, () => {}, () => { phase = 'done'; showResult(got, 0); }); return; }
    saveBest(L, got);
    if (got === 3) unlockAchievement('lightning');
    if (got === 0) unlockAchievement('slowpoke');
    if (timeLeft / timeMax < 0.05) unlockAchievement('close');
    if (WORLDS[0].levels.every(lv => best[lv] === 3)) unlockAchievement('perfect');
    // Monedas: 5 por pasar el nivel la primera vez + 10 por cada estrella que mejore tu récord anterior
    const prev = prog.paid[L];
    const earned = (prev === undefined ? COIN_CLEAR : 0) + COIN_STAR * Math.max(0, got - (prev || 0));
    prog.paid[L] = Math.max(prev || 0, got);
    addCoins(earned);
    // El panel aparece con el jugador aún sobre la isla; el despegue llega al pulsar "Siguiente salto"
    tween(1.1, () => {}, () => { phase = 'done'; showResult(got, earned); });
  }

  // Despegue: se agacha, enciende la mochila y sube recto como un cohete; los bloques caen sin él
  function liftOff(then) {
    phase = 'launching';
    const body = player.userData.body;
    tween(0.2, k => body.scale.set(1 + 0.2 * k, 1 - 0.3 * k, 1 + 0.2 * k), () => {
      scene.attach(player);
      const y0 = player.position.y;
      setFlames(true); spawnPuff(player.position.clone()); Snd.sfx.thrust(1.4);
      for (const c of Object.values(cells)) dropObject(c.group);
      cells = {};
      tween(1.25, k => {
        const e = Math.min(1, k * 3);
        body.scale.set(1 - 0.15 * e, 1 + 0.35 * e, 1 - 0.15 * e);
        player.position.y = y0 + 13 * Math.pow(k, 1.6);   // recto hacia arriba, acelerando
      }, () => {
        freshPlayer(); player.visible = false;
        then();
      });
    });
  }

  // ---------- Estrellas: HUD y mejor resultado ----------
  let best = {};
  try { best = JSON.parse(localStorage.getItem('uplands-best') || '{}') || {}; } catch (e) { best = {}; }
  function saveBest(i, n) {
    if (best[i] === undefined || n > best[i]) best[i] = n;
    try { localStorage.setItem('uplands-best', JSON.stringify(best)); } catch (e) {}
    renderDots();
  }
  function renderDots() {}
  const starsFor = f => (f > 0.6 ? 3 : f > 0.35 ? 2 : f > 0.15 ? 1 : 0);
  const starsNow = () => starsFor(timeLeft / timeMax);
  function tickBar(dt) {
    if (!timersOn || (phase !== 'idle' && phase !== 'moving')) return;
    timeLeft = Math.max(0, timeLeft - dt);
    const st = starsNow();
    if (st < starsShown) { starsShown = st; Snd.sfx.starLost(); if (!prog.slowUnlocked) pendingSlow = true; }
    renderBar();
    if (timeLeft <= 0 && phase === 'idle') timeUp();   // si estaba saltando, espera a que aterrice
  }
  function renderBar() {
    const f = timeLeft / timeMax, fill = $('tfill');
    fill.style.width = (f * 100) + '%';
    fill.style.background = f > 0.6 ? '#3fb36b' : f > 0.35 ? '#e0b030' : f > 0.15 ? '#e8833a' : '#d9443a';
    fill.classList.toggle('urgent', timersOn && f <= 0.15);
    document.querySelectorAll('#tbar .mstar').forEach((el, i) => el.classList.toggle('lost', starsFor(f) < i + 1));
  }
  // Se acabó el tiempo: caen todos los bloques, y el jugador con el suyo
  function timeUp() {
    phase = 'timeout'; queued = null; clearHints();
    Snd.sfx.lose(); Snd.sfx.fall(); vib([60, 40, 60]);
    for (const c of Object.values(cells)) dropObject(c.group);
    cells = {};
    showBanner(`${tr('timeUp')}<small>${tr('timeUpS')}</small>` + retryBtn() + `<button class="tolevels" type="button">${tr('levels')}</button>`, 'stuck');
    document.body.classList.add('timeout');
  }

  // ---------- Economía, logros y tutorial de la pista ----------
  const COIN_CLEAR = 5, COIN_STAR = 10, COIN_ACH = 25, HINT_COST = 15, UNDO_COST = 40, SLOW_COST = 20, SLOW_DUR = 15;
  let prog = { coins: 0, paid: {}, hintUnlocked: false, undoUnlocked: false, slowUnlocked: false, ach: {}, free: { hint: true, undo: true, slow: true }, stats: {}, seen: {} };
  try { prog = Object.assign(prog, JSON.parse(localStorage.getItem('uplands-progress') || '{}')); } catch (e) {}
  const saveProg = () => { try { localStorage.setItem('uplands-progress', JSON.stringify(prog)); } catch (e) {} };
  function renderCoins(pop) {
    const el = $('coins'); el.textContent = prog.coins;
    if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    const price = (k, c) => (prog.free[k] ? tr('free') : c);
    $('hintBtn').hidden = !prog.hintUnlocked;
    const setCost = (id, v) => { $(id).querySelector('.cost').innerHTML = typeof v === 'string' ? v : `<span class="coin"></span>${v}`; };
    setCost('hintBtn', price('hint', HINT_COST));
    $('undoBtn').hidden = !prog.undoUnlocked;
    setCost('undoBtn', price('undo', UNDO_COST));
    $('slowBtn').hidden = !prog.slowUnlocked;
    if (slowLeft <= 0) setCost('slowBtn', price('slow', SLOW_COST));
  }
  // Cobra un potenciador: el primer uso de cada uno es gratis
  function payFor(kind, cost, label) {
    if (prog.free[kind]) { prog.free[kind] = false; saveProg(); renderCoins(); return true; }
    if (prog.coins < cost) { toast(tr('needCoins'), tr('costIs', { what: label, c: cost, have: prog.coins })); return false; }
    addCoins(-cost);
    return true;
  }
  function addCoins(n) { if (!n) return; if (n > 0) Snd.sfx.coin(); prog.coins = Math.max(0, prog.coins + n); saveProg(); renderCoins(true); }
  let toastTimer = 0;
  function toast(title, sub) {
    const t = $('toast');
    t.innerHTML = `<span class="coin"></span><span><b>${title}</b><small>${sub}</small></span>`;
    t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  // Logros ocultos: solo se anuncian al conseguirlos
  function unlockAchievement(id) {
    if (prog.ach[id]) return;
    const a = ACHIEVEMENTS.find(x => x.id === id); if (!a) return;
    const [name, desc] = achText(a);
    prog.ach[id] = true; addCoins(COIN_ACH); Snd.sfx.achieve();
    toast(tr('achToast', { name }), tr('achCoins', { desc, n: COIN_ACH }));
    vib([30, 50, 30]);
  }
  // Modal genérico: pausa el juego hasta que se elige una acción
  function openModal(title, body, actions, onOpen) {
    phase = 'modal'; queued = null;
    $('modalTitle').innerHTML = title;
    $('modalBody').innerHTML = body;
    const box = $('modalActions'); box.innerHTML = '';
    for (const a of actions) {
      const b = document.createElement('button');
      b.textContent = a.label; if (a.primary) b.className = 'primary';
      b.addEventListener('click', () => { Snd.sfx.click(); stopDemo(); $('modal').hidden = true; phase = 'idle'; a.onClick && a.onClick(); });
      box.appendChild(b);
    }
    $('modal').hidden = false;
    box.lastChild.focus();
    if (onOpen) onOpen();
  }
  const costLine = (txt) => `<div class="cost"><span class="coin"></span><span>${txt}</span></div>`;
  const unlock = (k) => { prog[k] = true; saveProg(); renderCoins(); };

  // Pista: la primera vez que el jugador llega a un cruce (3+ caminos) desde el nivel 3
  function maybeHintTutorial() {
    if (prog.hintUnlocked || L < 2) return false;
    if (Object.keys(DIRS).filter(canMove).length < 3) return false;
    openModal(tr('hintTitle'),
      `<p>${tr('hintP1')}</p>` + costLine(tr('hintCost', { c: HINT_COST, have: prog.coins })) + `<p>${tr('hintP2')}</p>`,
      [{ label: tr('ok'), primary: true, onClick: () => { unlock('hintUnlocked'); checkStuck(); } }]);
    return true;
  }

  // Deshacer: se propone la primera vez que un movimiento deja el nivel sin solución
  let history = [];
  function pushHistory() {
    history.push({
      pos: pos.slice(), remaining, timersOn, timeLeft,
      cells: Object.values(cells).map(c => ({
        key: c.key, x: c.x, z: c.z, kind: c.kind, base: c.base, coins: c.coins, passes: c.passes, dir: c.dir, color: c.color, pair: c.pair,
        green: c.green, bobAmp: c.bobAmp, bobSpeed: c.bobSpeed, bobPhase: c.bobPhase,
        star: c.star ? { time: c.star.time, left: c.star.left, idx: c.star.idx } : null,
      })),
    });
    if (history.length > 300) history.shift();
  }
  function maybeUndoTutorial() {
    if (prog.undoUnlocked || !history.length) return false;
    const budget = { n: 200000 };
    const ok = solvable(snapshot(), key(pos[0], pos[1]), new Map(), budget);
    if (ok || budget.n < 0) return false;   // si no se pudo comprobar del todo, no molestamos
    openModal(tr('undoTitle'),
      `<p>${tr('undoP1')}</p><p>${tr('undoP2')}</p>` + costLine(tr('firstFree', { c: UNDO_COST })),
      [{ label: tr('keepGoing'), onClick: () => { unlock('undoUnlocked'); checkStuck(); } },
       { label: tr('undoFree'), primary: true, onClick: () => { unlock('undoUnlocked'); undo(); } }]);
    return true;
  }
  function lostButtons() {
    return retryBtn() + (prog.undoUnlocked && history.length ? `<button class="undo" type="button">${tr('undoPrice', { p: prog.free.undo ? tr('free') : UNDO_COST })}</button>` : '');
  }
  function undo() {
    if (!prog.undoUnlocked || !history.length) return;
    if (phase !== 'idle' && phase !== 'lost') return;
    if (!payFor('undo', UNDO_COST, tr('whatUndo'))) return;
    restoreState(history.pop());
  }
  // Reconstruye el tablero tal como estaba antes del último movimiento
  function restoreState(snap) {
    Snd.sfx.undo();
    hideBanner(); queued = null;
    for (const c of Object.values(cells)) if (c.outer && c.outer.parent) { disposeMerged(c.outer); c.outer.parent.remove(c.outer); }
    const facing = player.rotation.y;
    freshPlayer();
    player.rotation.y = facing;   // al deshacer mantiene hacia dónde miraba
    cells = {};
    for (const sc of snap.cells) {
      const c = { ...sc, star: sc.star ? { ...sc.star } : null };
      c.group = makeTile(c);
      c.outer = new THREE.Group(); c.outer.add(c.group);
      c.outer.position.copy(toWorld(c.x, c.z));
      world.add(c.outer);
      cells[c.key] = c;
    }
    pos = snap.pos.slice(); remaining = snap.remaining; setCount(remaining);
    timeLeft = snap.timeLeft; timersOn = snap.timersOn; starsShown = starsNow(); renderBar();
    rippleT = clock.elapsedTime - 10;   // sin ondas: directamente a flotar
    const here = cells[key(pos[0], pos[1])];
    here.group.add(player); player.position.set(0, 0, 0); player.visible = true;
    phase = 'idle';
    squash();
    checkStuck();
  }

  // Cámara lenta: se presenta la primera vez que se apaga una estrella
  let slowLeft = 0, pendingSlow = false;
  function openSlowTutorial() {
    const anyLeft = starsNow() > 0;
    openModal(tr('slowTitle'),
      `<p>${tr('slowP1')}</p><p>${tr('slowP2', { s: SLOW_DUR })}</p>` + costLine(tr('firstFree', { c: SLOW_COST })),
      anyLeft
        ? [{ label: tr('notNow'), onClick: () => unlock('slowUnlocked') },
           { label: tr('tryFree'), primary: true, onClick: () => { unlock('slowUnlocked'); activateSlow(); } }]
        : [{ label: tr('ok'), primary: true, onClick: () => unlock('slowUnlocked') }]);
  }
  function activateSlow() {
    if (slowLeft > 0 || (phase !== 'idle' && phase !== 'moving')) return;

    slowLeft = SLOW_DUR;
    document.body.classList.add('slow');
    Snd.sfx.slowOn(); Snd.setSlow(true);
    $('slowBtn').classList.add('active');
  }
  function endSlow() {
    if (document.body.classList.contains('slow')) { Snd.sfx.slowOff(); Snd.setSlow(false); }

    document.body.classList.remove('slow');
    $('slowBtn').classList.remove('active');

  }

  // ---------- Pista: qué movimientos siguen llevando a una solución ----------
  // Simula las mismas reglas del juego sobre una copia del estado actual.

  // Mapa aleatorio con solución: se traza un recorrido al azar (sin volver sobre tus pasos) y cada casilla
  // recibe tantos pasos como veces se pisa; así el propio recorrido es una solución. Las casillas de
  // varias capas solo se permiten en cruces (3 o más vecinos). Luego se añaden algunas piezas especiales
  // que no rompen el recorrido: flechas, hielo donde se sigue recto y un botón con su barrera.
  function edGenerate(W, H, fill) {
    const DK = Object.keys(DIRS), ARR = { N: '^', S: 'v', E: '>', W: '<' }, OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
    const N = W * H, rnd = n => Math.floor(Math.random() * n);

    for (let attempt = 0; attempt < 600; attempt++) {
      // ocupación pedida (con el mínimo para que haya mapa)
      const target = Math.max(4, Math.min(N, Math.round(N * fill)));
      const vis = {}, walk = [], dirs = [];
      let x = rnd(W), z = rnd(H), last = null;
      const k0 = key(x, z); vis[k0] = 1; walk.push(k0);
      for (let guard = 0; guard < N * 3; guard++) {
        const opts = [];

          if (last && d === OPP[last]) continue;
          const nx = x + DIRS[d][0], nz = z + DIRS[d][1], nk = key(nx, nz);
          if (nx < 0 || nz < 0 || nx >= W || nz >= H || nk === k0) continue;
          const v = vis[nk] || 0;
          if (v >= 3) continue;
          opts.push([d, nx, nz, nk, v ? 0.12 : 1]);

        if (!opts.length) break;
        let r = Math.random() * opts.reduce((a, o) => a + o[4], 0), o = opts[0];
        for (const c of opts) { r -= c[4]; if (r <= 0) { o = c; break; } }
        [last, x, z] = o; vis[o[3]] = (vis[o[3]] || 0) + 1; walk.push(o[3]); dirs.push(o[0]);
        if (Object.keys(vis).length >= target) break;
      }
      const tiles = Object.keys(vis), count = tiles.length;
      if (count < Math.max(4, target * 0.9)) continue;
      // varias capas solo en cruces
      const nb = k => { const [a, b] = k.split(',').map(Number); return DK.filter(d => vis[key(a + DIRS[d][0], b + DIRS[d][1])]).length; };
      if (tiles.some(k => vis[k] > 1 && nb(k) < 3)) continue;
      const multi = tiles.filter(k => vis[k] > 1).length;
      // que el mapa se reparta por el tablero y no se amontone en una esquina
      const cols = new Set(tiles.map(k => k.split(',')[0])).size, rowsN = new Set(tiles.map(k => k.split(',')[1])).size;
      const score = 3 * (cols / W + rowsN / H) * Math.max(W, H) - 4 * Math.abs(count - target) + 2 * Math.min(multi, Math.ceil(N / 12)) - 3 * Math.max(0, multi - Math.ceil(N / 8));
      if (!best || score > best.score) best = { score, vis, walk, dirs };
    }
    if (!best) return false;
    const { vis, walk, dirs } = best;
    const grid = Array.from({ length: H }, () => Array(W).fill('.'));
    const set = (k, t) => { const [a, b] = k.split(',').map(Number); grid[b][a] = t; };
    const single = i => i > 0 && vis[walk[i]] === 1;
    walk.forEach((k, i) => set(k, i === 0 ? 'S' : String(vis[k])));
    const used = new Set();
    // hielo: casilla que se cruza en línea recta y no es la última
    for (let i = 1; i < walk.length - 1; i++)
      if (single(i) && dirs[i - 1] === dirs[i] && Math.random() < 0.18) { set(walk[i], '+'); used.add(i); }
    // flechas: en el sentido en que se entra
    for (let i = 1; i < walk.length; i++)
      if (single(i) && !used.has(i) && !used.has(i - 1) && Math.random() < 0.1) { set(walk[i], ARR[dirs[i - 1]]); used.add(i); }

    if (walk.length > 10 && Math.random() < 0.6) {
      const ks = walk.map((_, i) => i).filter(i => single(i) && !used.has(i) && !used.has(i - 1) && i < walk.length - 4);
      if (ks.length) {

      }

    const { s: st0, start, errors } = stateFromRows(grid.map(r => r.join(' ')));

  }

  // ---------- Sonido: música zen generativa y efectos, todo sintetizado con Web Audio ----------
  // (sin archivos: el navegador solo deja sonar audio después del primer clic o tecla)
  const Snd = (() => {
    let ctx = null, musicBus, musicFilter, sfxBus, noiseBuf, timer = 0, slow = false, lastDeg = 6;
    const drones = [];
    let vol = { music: settings.music, sfx: settings.sfx }, muted = false;
    const SCALE = [0, 2, 4, 7, 9];          // pentatónica mayor

      musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000;

      const sfxWet = ctx.createGain(); sfxWet.gain.value = 0.25; sfxBus.connect(sfxWet); sfxWet.connect(verb);

      if (!ctx || muted || (o.bus === musicBus ? vol.music : vol.sfx) <= 0) return;

      const osc = ctx.createOscillator(); osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + a + d);

      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t + a);

      bump:     () => vib(12) || tone(120, { to: 70, dur: 0.12, gain: 0.22, type: 'square', lp: 380 }),
      gem:      (n) => { const d = 8 + (n % 5); bell(freq(d), 0.16); bell(freq(d + 2), 0.08, 0.07); },
      star:     () => vib(25) || [0, 1, 2, 3].forEach(i => bell(freq(10 + i), 0.13, i * 0.07)),
      starLost: () => { const k = slow ? 0.5 : 1; tone(freq(8) * k, { to: freq(4) * k, dur: 0.6 / k, gain: 0.08, type: 'triangle' }); },
      fall:     () => noise({ f0: 900, f1: 140, dur: 0.6, gain: 0.08 }),
      slide:    (d) => noise({ f0: 5200, f1: 3000, dur: d, gain: 0.07, type: 'highpass', q: 0.7 }),
      portalIn: () => { tone(220, { to: 1100, dur: 0.42, gain: 0.1 }); noise({ f0: 400, f1: 2600, dur: 0.45, gain: 0.05 }); },
      portalOut:() => { tone(1100, { to: 320, dur: 0.12, gain: 0.07 }); tone(420, { to: 1300, dur: 0.4, gain: 0.08, delay: 0.05 }); },
      button:   () => { vib(20); tone(170, { to: 90, dur: 0.12, gain: 0.28, type: 'square', lp: 600 }); tone(1300, { dur: 0.035, gain: 0.06, type: 'square' }); },
      barrier:  () => { tone(120, { to: 52, dur: 0.6, gain: 0.16, type: 'sawtooth', lp: 320, delay: 0.08 }); noise({ f0: 700, f1: 120, dur: 0.6, gain: 0.05, delay: 0.08 }); },
      gate:     () => tone(280, { to: 170, dur: 0.28, gain: 0.1, type: 'triangle' }),
      land:     () => { tone(95, { to: 48, dur: 0.3, gain: 0.3 }); noise({ f0: 500, f1: 90, dur: 0.3, gain: 0.06 }); },
      win:      () => vib([20, 40, 20, 40, 60]) || [0, 1, 2, 3, 4, 5, 7].forEach((d, i) => bell(freq(5 + d), 0.13, i * 0.09)),
      lose:     () => { tone(freq(6), { to: freq(4), dur: 0.45, gain: 0.1, type: 'triangle' }); tone(freq(4), { to: freq(1), dur: 0.7, gain: 0.1, type: 'triangle', delay: 0.28 }); },
      voidFall: () => tone(760, { to: 110, dur: 1.1, gain: 0.1 }),
      count:    () => bell(freq(7), 0.1, 0),
      go:       () => { bell(freq(14), 0.12, 0); bell(freq(16), 0.1, 0.05); },
      hint:     () => [0, 2, 4].forEach((d, i) => bell(freq(12 + d), 0.07, i * 0.06)),
      undo:     () => { noise({ f0: 220, f1: 2400, dur: 0.35, gain: 0.07 }); tone(420, { to: 260, dur: 0.3, gain: 0.08, type: 'triangle' }); },
      thrust:   (d) => { noise({ f0: 260, f1: 110, dur: d, gain: 0.14, type: 'lowpass', q: 0.8 }); noise({ f0: 1800, f1: 900, dur: d * 0.8, gain: 0.03, type: 'bandpass' }); },
      slowOn:   () => tone(620, { to: 140, dur: 0.9, gain: 0.1 }),
      slowOff:  () => tone(140, { to: 620, dur: 0.5, gain: 0.08 }),
      coin:     () => { tone(1320, { dur: 0.07, gain: 0.07, type: 'square', lp: 3200 }); tone(1760, { dur: 0.25, gain: 0.07, type: 'square', lp: 3200, delay: 0.07 }); },
      achieve:  () => [0, 2, 4, 7].forEach((d, i) => bell(freq(7 + d), 0.14, i * 0.11)),
      click:    () => tone(880, { dur: 0.03, gain: 0.05, type: 'triangle' }),
    };
    // Cámara lenta: el dron baja una octava deslizándose, la música se apaga un poco (filtro) y las notas se alargan
    function setSlow(v) {
      slow = v;
      if (!ctx) return;
      const t = ctx.currentTime;
      drones.forEach((o, i) => o.detune.setTargetAtTime((i - 1) * 5 + (v ? -1200 : 0), t, v ? 0.5 : 0.3));
      musicFilter.frequency.setTargetAtTime(v ? 1100 : 18000, t, v ? 0.4 : 0.3);
    }
    return { init, sfx, setSlow, setVolumes: (m, f) => { vol = { music: m, sfx: f }; applyMode(); }, toggleMute: () => { muted = !muted; applyMode(); } };
  })();
  addEventListener('pointerdown', () => Snd.init());
  addEventListener('keydown', () => Snd.init());

  // ---------- Bucle ----------
  const clock = new THREE.Clock();
  let wtime = 0;
  function loop() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const t = tweens[i];
      t.t += dt;
      const k = Math.min(1, t.t / t.dur);
      t.update(k);
      if (k >= 1) { tweens.splice(i, 1); t.done && t.done(); }
    }
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.t += dt; f.vy -= 14 * dt;
      f.obj.position.y += f.vy * dt;
      f.obj.rotation.z += f.spin * dt; f.obj.rotation.x += f.spin * 0.6 * dt;
      const op = Math.max(0, 1 - Math.max(0, f.t - 0.35) / 0.8);
      f.obj.traverse(o => { if (o.material) o.material.opacity = Math.min(o.material.opacity, op); });
      if (f.t > 1.4) { f.obj.parent && f.obj.parent.remove(f.obj); falling.splice(i, 1); }
    }
    // Cámara lenta: el mundo (estrellas, flotación, gemas, portales, nubes) usa un reloj a mitad de velocidad;
    // el jugador, los saltos y lo que él activa (botones, vallas, caídas) siguen a velocidad normal
    if (slowLeft > 0 && (phase === 'idle' || phase === 'moving' || phase === 'lost')) {
      slowLeft -= dt;
      $('slowBtn').querySelector('.cost').textContent = `${Math.ceil(Math.max(0, slowLeft))} s`;
      if (slowLeft <= 0) endSlow();
    }
    const wdt = dt * (slowLeft > 0 ? 0.5 : 1);
    wtime += wdt;
    tickBar(wdt);
    if (player.userData.flames.visible) player.userData.flames.children.forEach(f => { f.scale.y = 0.75 + Math.random() * 0.55; });
    updateWeather(wdt, wtime);
    if (phase === 'idle' && !$('pause').hidden) phase = 'paused';
    if (pendingSlow && phase === 'idle') { pendingSlow = false; openSlowTutorial(); }
    // Flotación: ondas desde la casilla de aterrizaje que se calman y pasan a flotar cada bloque por su cuenta
    if (rippleT >= 0) {
      const rt = time - rippleT;
      const w = Math.min(1, Math.max(0, (rt - 0.8) / 2.5));
      for (const c of Object.values(cells)) {
        const r = Math.hypot(c.x - rippleO[0], c.z - rippleO[1]);
        const tt = rt - r / 3.2;
        let y = 0;
        if (tt > 0 && tt < 3) y -= 0.05 * Math.exp(-2.2 * tt) * Math.sin(tt * Math.PI * 2 * 1.3) / (1 + r * 0.35);
        y += w * c.bobAmp * Math.sin(wtime * c.bobSpeed + c.bobPhase);
        c.group.position.y = y;
      }
    }
    for (const c of Object.values(cells)) {
      for (const g of c.gems) {
        g.rotation.y += wdt * 1.6; g.position.y = 0.34 + Math.sin(wtime * 2.4 + g.userData.phase) * 0.04;
        if (g.material.emissive) g.material.emissiveIntensity = 0.45 + 0.25 * Math.sin(wtime * 3 + g.userData.phase);   // pulso de energía
      }
      if (c.hintFx) { const tk = 0.2 + 0.07 * Math.sin(time * 4); for (const mt of c.hintFx.userData.mats) mt.emissive.copy(mt.userData.baseEmissive).lerp(HINT_TINT, tk);
        const ar = c.hintFx.userData.arrow; ar.position.y = ar.userData.baseY + 0.1 * Math.abs(Math.sin(time * 3.2)); ar.rotation.y = time * 1.2; }
      if (c.portalFx) c.portalFx.userData.update(wdt, wtime);
    }
    for (const cl of clouds) { cl.position.x += cl.userData.v * wdt; if (cl.position.x > 14) cl.position.x = -14; }
    if (document.body.dataset.screen === 'map' && map.built) {
      updateMap(dt, time); renderer.render(mapScene, mapCam);
      renderer.autoClear = false; renderer.clearDepth(); renderer.render(mapAvatarScene, mapCam); renderer.autoClear = true;
    }
    else renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  applyI18n();
  renderCoins();
  // Icono del tanque: el mismo bidón del juego, renderizado una vez a una imagen
  (function renderCanIcon() {
    try {
      const cv = document.createElement('canvas'); cv.width = cv.height = 96;
      const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
      const sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight(0xffffff, 0x6a6a6a, 0.95));
      const dl = new THREE.DirectionalLight(0xffffff, 0.75); dl.position.set(2, 3, 4); sc.add(dl);
      const can = makeCell(); can.rotation.set(0.2, -0.55, 0); sc.add(can);
      const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 10); cam.position.set(0, 0.06, 0.95); cam.lookAt(0, 0.03, 0);
      r.render(sc, cam);
      $('tankCan').src = cv.toDataURL('image/png');
      r.dispose(); if (r.forceContextLoss) r.forceContextLoss();
    } catch (e) { $('tankCan').hidden = true; }
  })();
  // Arranque: splash con el logo y después la pantalla de inicio
  setScreen('splash'); applyTheme(THEMES.cielo); phase = 'menu';
  const leaveSplash = () => {
    if (document.body.dataset.screen !== 'splash') return;
    $('splash').classList.add('out');
    setTimeout(() => { $('splash').hidden = true; openHome(); }, 600);
  };
  setTimeout(leaveSplash, 2200);
  $('splash').addEventListener('click', leaveSplash);
  loop();
})();
</script>
